# LiteLLM proxy config for Rift local-LLM mode.
#
# Sits behind strip_thinking_proxy.py (the shim on :4000 -> this on :4001).
#
# ollama_chat/ (NOT ollama/) is mandatory: it routes to Ollama's /api/chat for
# NATIVE function calling. The plain ollama/ provider uses /api/generate, where
# the model prints tool calls as raw JSON text Rift can't execute.
#
# drop_params/modify_params are hygiene; the shim is what actually strips the
# Anthropic `thinking` param for models that can't think (qwen3-coder). Thinking-
# capable models (qwen3:*) keep it — the shim passes thinking through for them.
#
# Launch:  litellm --config <this> --port 4001
# Verify:  curl :4000/v1/messages (through the shim) -> HTTP 200.

litellm_settings:
  drop_params: true
  modify_params: true

model_list:
  # Thinking-capable general/coding model — reasons + calls tools. Default.
  # num_ctx 32768: Ollama defaults to ~4K, which truncates Rift's large system
  # prompt + MCP tool definitions and wrecks tool use. Provider-specific param,
  # passed straight through to Ollama (not dropped by drop_params).
  - model_name: ollama/qwen3:14b
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://localhost:11434
      num_ctx: 32768

  # Coding-focused, NO thinking support — the shim strips `thinking` for it.
  - model_name: ollama/qwen3-coder:30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://localhost:11434
      num_ctx: 32768
      additional_drop_params: ["thinking"]
