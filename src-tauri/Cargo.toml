[package]
name = "rift-tauri"
version = "0.2.11-alpha-test"
description = "Rift v14 — remote dev workspace for FiveM/RedM teams"
authors = ["Blazzer"]
edition = "2021"

[lib]
name = "rift_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — narrowed from "full" to what we actually use.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }

# SSH + SFTP — pure Rust, no libssh2/C deps. Reference: T-Shell, Reach, Shell360.
russh = { version = "0.60", default-features = false, features = ["ring", "rsa", "flate2", "async-trait"] }
russh-sftp = "2.1"

# L9: force `ring` crypto provider on rustls — drops aws-lc-rs from dep tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# M13: structured cancellation tokens for in-flight downloads.
tokio-util = { version = "0.7", features = ["rt"] }

# File system watcher — replaces .NET FileSystemWatcher
notify = "8"

# Auto-updater — same Velopack ecosystem we use on the WPF side
velopack = "=0.0.1298"
# HTTP client for our custom GithubSource (velopack-rust 0.0.1298 has no
# GithubSource type; we implement UpdateSource against the GitHub REST API).
ureq = "3"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
chrono = { version = "0.4", features = ["serde"] }

# SHA1 — pure Rust (RustCrypto). Used by SyncSnapshot for content-hash drift jitter
# elimination + first-scan equality. NOT cryptographically-strong needs; matches
# the WPF side's System.Security.Cryptography.SHA1.
sha1 = "0.10"
dashmap = "6.1.0"
walkdir = "2.5.0"
futures = "0.3.32"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"] }

# Phase 1h: server pubkey fingerprint pinning (OpenSSH-style SHA256:base64).
# `sha2` for the digest, `base64` w/ NO_PAD engine to match OpenSSH's
# `ssh-keygen -lf` output. Profile field `fingerprint` is also accepted in WPF's
# WinSCP format (`ssh-ed25519 256 SHA256:xxx`) via substring match in Handler.
sha2 = "0.10"
base64 = "0.22"

# Phase 1j: ed25519 keypair generation for SshKeygen. ssh-key types come via
# russh::keys; rand 0.10 provides `rand::rng()` for `PrivateKey::random`
# (russh 0.60 dropped the rand_core 0.6 OsRng path in favor of rand_core 0.10).
rand = "0.10"
