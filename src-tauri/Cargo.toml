[package]
name = "rift-tauri"
version = "0.1.0"
description = "Rift v14 — remote dev workspace for FiveM/RedM teams"
authors = ["Blazzer"]
edition = "2021"

[lib]
name = "rift_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH + SFTP — pure Rust, no libssh2/C deps. Reference: T-Shell, Reach, Shell360.
russh = { version = "0.54", default-features = false, features = ["ring", "rsa", "flate2", "async-trait"] }
russh-sftp = "2.1"

# File system watcher — replaces .NET FileSystemWatcher
notify = "8"

# Auto-updater — same Velopack ecosystem we use on the WPF side
velopack = "0.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
