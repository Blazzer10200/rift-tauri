[package]
name = "rift-tauri"
version = "0.86.4"
description = "Rift — local-workspace coding assistant powered by Claude"
authors = ["Blazzer"]
edition = "2021"

[lib]
name = "rift_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default build = no native Whisper. Every other STT subsystem (mic capture,
# VAD, model download, Haiku cleanup, Settings + IPC) is unconditional. To
# enable on-device Whisper inference, install dependencies + opt in:
#
#   1. Install LLVM/Clang (libclang.dll is needed by `whisper-rs-sys`'s
#      bindgen step): https://github.com/llvm/llvm-project/releases or
#      `winget install LLVM.LLVM` (needs admin).
#   2. (Optional, for 10× speedup) install the NVIDIA CUDA Toolkit and set
#      `CUDA_PATH`: https://developer.nvidia.com/cuda-downloads
#   3. Rebuild:
#      * CPU:  `cargo build --release --features whisper-rs`
#      * CUDA: `cargo build --release --features whisper-rs,whisper-cuda`
#
# Until then, `engine: "whisper"` returns a clean error telling the user
# what to install; `engine: "web_speech"` keeps working as before.
default = []
whisper-rs = ["dep:whisper-rs"]
whisper-cuda = ["whisper-rs", "whisper-rs/cuda"]
# Enables the RIFT_UPDATE_FEED local-feed escape hatch in a RELEASE build, so
# the full auto-update apply chain (download -> swap -> relaunch) can be tested
# locally against a packed local feed without burning a real GitHub release.
# Production releases (release.ps1 / release.yml) build WITHOUT this, so a
# shipped binary can never be pointed at a local/attacker feed. See
# scripts/test-update.ps1.
update-test-feed = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Throwaway temp dirs for git_local integration tests (real `git` against a
# scratch repo). Already in the lock tree transitively; pinned to that version.
tempfile = "3.27"

[dependencies]
# `unstable` gates the multiwebview API (Window::add_child) used to embed the
# in-app browser as a native child webview docked beside the chat. Non-semver-
# stable surface — pin tauri minor + re-verify add_child on tauri upgrades.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
# Native OS folder picker — Assistant uses it for "Open Folder…" so the user
# can point Rift at any local project, decoupled from Sync's server folders.
tauri-plugin-dialog = "2"
# Clipboard read for the custom right-click Paste (navigator.clipboard.readText
# is permission-gated in WebView2; the plugin is the deterministic path).
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — narrowed from "full" to what we actually use.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }

# Force the `ring` crypto provider on rustls — keeps aws-lc-rs out of the dep tree
# (verified via `cargo tree -i aws-lc-rs` → no match). Paired with reqwest's
# `rustls-no-provider` feature below; `run()` in lib.rs installs ring as the
# process-default provider so reqwest's no-provider build finds one at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# M13: structured cancellation tokens for in-flight downloads (CancellationToken
# lives in tokio_util::sync, which needs no extra feature in 0.7.x — there is no
# `sync` feature; `rt` is the historical, harmless feature value).
tokio-util = { version = "0.7", features = ["rt"] }

# Auto-updater: Velopack (v0.4.47+). Background download + apply-on-exit +
# relaunch via Velopack's Update.exe — one-click then unattended. v1.x ships a
# native GithubSource so no custom REST source is needed. See update_service.rs
# (arc: `git log -- docs/design/velopack-auto-update.md`). PINNED EXACT: the `vpk` CLI version
# MUST equal this crate version (both 1.2.0) so the packed Update runtime ==
# the linked runtime. Bump vpk (`dotnet tool update -g vpk`) and this pin together.
velopack = "=1.2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
chrono = { version = "0.4", features = ["serde"] }

walkdir = "2.5.0"
# Assistant α2 — Rift MCP server uses regex for the `rift__grep` tool. Pure-Rust
# regex impl already transitively pulled in by env_logger; declaring it
# directly lets us import w/o relying on transitive paths.
regex = "1"
futures = "0.3.32"
# `rustls-no-provider` (NOT `rustls`): reqwest's `rustls` feature pulls in
# `__rustls-aws-lc-rs`, re-adding aws-lc-rs despite the ring pin above (cont.228).
# `-no-provider` enables rustls + the platform verifier but leaves provider
# selection to our ring pin on line ~68. (NB: velopack→ureq pulls aws-lc-rs on its
# own path, so the crate may still appear in `cargo tree` — this drops reqwest's.)
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "stream", "json"] }

# sha2 — SHA-256 digest for STT Whisper model-download integrity verification
# (see stt/model_manager.rs). Pure-Rust RustCrypto impl.
sha2 = "0.10"

# Assistant UI bridge (assistant/bridge.rs) — loopback token generation
# (`rand::fill`) + base64url token/request-id encoding in the MCP child.
rand = "0.10"
base64 = "0.22"
rustls-native-certs = "0.8"

# Phase 6 (#9.3 / #37 / #38): OS-keychain bridge. Windows Credential Manager,
# macOS Keychain, Linux Secret Service. Migrates bridge_token + api_key out of
# the plaintext ~/.rift/*.json files.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Speech-to-text — Phase 3: mic capture.
#   - `cpal` for cross-platform audio input (WASAPI on Windows).
#   - `rubato` for sample-rate conversion to Whisper's 16 kHz mono f32.
cpal = "0.15"
rubato = "0.16"

# Speech-to-text — Phase 4: VAD. Pure-Rust port of Google's WebRTC VAD —
# 10/20/30ms frame energy gating, no ONNX runtime needed. Cheaper than Silero;
# good enough for desktop dictation (Silero edge is noisy-environment robustness
# we don't need). Pairs w/ a post-Whisper blocklist for the residual silence-
# hallucination class.
webrtc-vad = "0.4"

# Speech-to-text — Phase 5: Whisper inference via whisper.cpp FFI.
# OPTIONAL — gated behind `whisper-rs` Cargo feature; see [features] header
# for the install + opt-in instructions. Marked `optional = true` so the
# default `cargo build` works on machines without LLVM/Clang installed.
whisper-rs = { version = "0.14", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# #61 GUI stale-PATH: CLI discovery reads the registry PATH (HKCU\Environment +
# HKLM Session Manager\Environment) at resolve time — the GUI process inherits
# explorer's login-frozen PATH, so a post-login `npm i -g` is invisible to
# where.exe until re-login. Pinned to the version already in the lock tree.
winreg = "0.55"

[package.metadata.cargo-machete]
# (rustls is now `use`d directly in lib.rs to install the ring provider, so it no
# longer needs a machete ignore. Kept block for any future feature-only deps.)

# Speech-to-text — Phase 2: local Whisper pipeline.
#   - `webkitSpeechRecognition` (Web Speech / Azure) kept as legacy engine.
#   - New engine: whisper-rs (whisper.cpp w/ CUDA) + cpal mic capture + Silero
#     VAD + optional Haiku polish. Model files live in `~/.rift/models/`,
#     downloaded from huggingface.co/ggerganov/whisper.cpp via `reqwest`
#     streaming + `sha2` integrity. Heavy crates (whisper-rs/cpal/ort) added
#     as their respective sub-modules land — Cargo deps stay minimal until then.
