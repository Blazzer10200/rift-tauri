<!-- @dsCard group="Components" name="Environment float" subtitle="Collapsed git pill over the chat's top-right — branch + dirty/clean state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rift — Environment float</title>
<style>
  :root {
    --bg: oklch(0.142 0.003 250);
    --surface: oklch(0.215 0.004 250);
    --border: oklch(0.300 0.006 255);
    --fg: oklch(0.925 0.004 250);
    --fg-3: oklch(0.700 0.013 258);
    --ok: oklch(0.73 0.18 150);
    --danger: oklch(0.71 0.17 22);
    --accent: oklch(0.78 0.15 163);
    --radius-lg: 10px;
    --fs-xs: 11px;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 13px; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--fg-3); margin: 0 0 24px; max-width: 64ch; }
  .section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: oklch(0.430 0.010 260); margin: 22px 0 12px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }

  .env-pill { display: inline-flex; align-items: center; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 4px 16px -6px rgb(0 0 0 / 0.4); overflow: hidden; }
  .pill-main { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 0;
    background: none; color: var(--fg); font: inherit; font-size: var(--fs-xs); cursor: pointer; max-width: 240px; }
  .pill-ic { color: var(--fg-3); flex: none; width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill-branch { font-weight: 600; }
  .pill-stat { display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums; flex: none; }
  .pill-clean { color: var(--fg-3); flex: none; }
  .adds { color: var(--ok); }
  .dels { color: var(--danger); }
  .pill-x { display: grid; place-items: center; width: 26px; align-self: stretch; border: 0;
    border-left: 1px solid var(--border); background: none; color: var(--fg-3); cursor: pointer; }
  .xic { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
</style>
</head>
<body>
  <h1>Environment float</h1>
  <p class="lede">A floating git pill anchored over the chat's top-right — not a dock. Shows the current branch and a
  live dirty count (<span style="color:var(--ok)">+adds</span> / <span style="color:var(--danger)">−dels</span>), or
  <i>clean</i>. Click to expand into the in-flow source-control panel; the ✕ dismisses it.</p>

  <div class="section-label">Dirty</div>
  <div class="row">
    <div class="env-pill">
      <button class="pill-main">
        <svg class="pill-ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5a6 6 0 0 1-6 6h-3.5"/></svg>
        <span class="pill-branch">main</span>
        <span class="pill-stat"><span class="adds">+128</span><span class="dels">−24</span></span>
      </button>
      <button class="pill-x"><svg class="xic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <div class="section-label">Clean</div>
  <div class="row">
    <div class="env-pill">
      <button class="pill-main">
        <svg class="pill-ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5a6 6 0 0 1-6 6h-3.5"/></svg>
        <span class="pill-branch">main</span>
        <span class="pill-clean">clean</span>
      </button>
      <button class="pill-x"><svg class="xic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</body>
</html>
