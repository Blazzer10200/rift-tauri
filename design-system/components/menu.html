<!-- @dsCard group="Components" name="Menu (rift-menu)" subtitle="Canonical dropdown — header, rows with leading slot + title/subtitle, current accent-bar, ✓" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rift — Menu</title>
<style>
  :root {
    --bg: oklch(0.142 0.003 250);
    --bg-inset: oklch(0.178 0.004 250);
    --surface: oklch(0.215 0.004 250);
    --surface-hover: oklch(0.262 0.005 250);
    --border: oklch(0.300 0.006 255);
    --fg: oklch(0.925 0.004 250);
    --fg-2: oklch(0.825 0.008 255);
    --fg-muted: oklch(0.700 0.013 258);
    --fg-subtle: oklch(0.545 0.016 262);
    --fg-faint: oklch(0.430 0.010 260);
    --accent: oklch(0.78 0.15 163);
    --ring: oklch(0.78 0.15 163 / 0.45);
    --radius-sm: 6px;
    --fs-sm: 12px;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 13px; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--fg-muted); margin: 0 0 24px; max-width: 64ch; }

  .rift-menu { width: 280px; padding: 5px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 18px 44px -8px oklch(0 0 0 / 0.55), 0 0 0 1px color-mix(in oklab, var(--accent) 6%, transparent),
      inset 0 1px 0 color-mix(in oklch, white 5%, transparent); }
  .rift-menu-head { display: flex; align-items: center; gap: 7px;
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--fg-faint); padding: 6px 8px; }
  .rift-menu-head .rift-menu-kbd { margin-left: auto; }
  .rift-menu-kbd { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: var(--fg-muted);
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; text-transform: none; letter-spacing: 0; line-height: 1.4; }
  .rift-menu-divider { height: 1px; margin: 5px 6px;
    background: linear-gradient(to right, color-mix(in oklch, var(--border) 70%, transparent), transparent); }
  .rift-menu-row { position: relative; display: flex; align-items: flex-start; gap: 9px; width: 100%;
    padding: 6px 8px; border-radius: var(--radius-sm); border: 0; background: transparent;
    color: var(--fg-2); cursor: pointer; font: inherit; text-align: left; }
  .rift-menu-row.active { background: var(--surface-hover); }
  .rift-menu-row-ic { width: 16px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    color: var(--fg-subtle); margin-top: 1px; }
  .rift-menu-row.active .rift-menu-row-ic { color: var(--fg-2); }
  .rift-menu-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .rift-menu-row-t { font-size: var(--fs-sm); font-weight: 600; color: var(--fg); line-height: 1.25; }
  .rift-menu-row-d { font-size: 10.5px; color: var(--fg-subtle); line-height: 1.3; }
  .rift-menu-row-chk { color: var(--accent); flex-shrink: 0; margin-top: 1px; }
  .rift-menu-row.current::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2.5px;
    border-radius: 0 3px 3px 0; background: var(--accent); box-shadow: 0 0 8px var(--ring); }
  .rift-menu-row.current .rift-menu-row-ic, .rift-menu-row.current .rift-menu-row-t { color: var(--accent); }
  .ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chk { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; }
</style>
</head>
<body>
  <h1>Menu (rift-menu)</h1>
  <p class="lede">One canonical dropdown language behind every chat-page popover — model, slash, mention, view, history.
  Rows are a leading icon slot + bold title over a muted subtitle; the active row washes, the current selection gets a
  glowing accent left-bar and a trailing ✓.</p>

  <div class="rift-menu">
    <div class="rift-menu-head">Model<span class="rift-menu-kbd">⌘M</span></div>
    <button class="rift-menu-row current">
      <span class="rift-menu-row-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg></span>
      <span class="rift-menu-row-body"><span class="rift-menu-row-t">Opus 4.8</span><span class="rift-menu-row-d">Most capable · deep reasoning</span></span>
      <span class="rift-menu-row-chk"><svg class="chk" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg></span>
    </button>
    <button class="rift-menu-row active">
      <span class="rift-menu-row-ic"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
      <span class="rift-menu-row-body"><span class="rift-menu-row-t">Sonnet 4.6</span><span class="rift-menu-row-d">Balanced · everyday work</span></span>
    </button>
    <button class="rift-menu-row">
      <span class="rift-menu-row-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg></span>
      <span class="rift-menu-row-body"><span class="rift-menu-row-t">Haiku 4.5</span><span class="rift-menu-row-d">Fastest · light tasks</span></span>
    </button>
    <div class="rift-menu-divider"></div>
    <button class="rift-menu-row">
      <span class="rift-menu-row-ic"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg></span>
      <span class="rift-menu-row-body"><span class="rift-menu-row-t">Effort &amp; settings</span><span class="rift-menu-row-d">Thinking, permissions, density</span></span>
    </button>
  </div>
</body>
</html>
