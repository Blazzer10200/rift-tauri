<!-- @dsCard group="Components" name="PageHero" subtitle="Shared page header — accent-tinted gradient, icon tile, eyebrow / title / sub, chip slot" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rift — PageHero</title>
<style>
  :root {
    --bg: oklch(0.142 0.003 250);
    --surface: oklch(0.215 0.004 250);
    --border: oklch(0.300 0.006 255);
    --fg: oklch(0.925 0.004 250);
    --fg-muted: oklch(0.700 0.013 258);
    --fg-subtle: oklch(0.545 0.016 262);
    --accent: oklch(0.78 0.15 163);
    --accent-soft: oklch(0.78 0.15 163 / 0.12);
    --ghost-border: oklch(0.78 0.15 163 / 0.35);
    --ok: oklch(0.73 0.18 150); --ok-soft: oklch(0.73 0.18 150 / 0.14);
    --fs-sm: 12px; --fs-xs: 11px;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 13px; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  .frame { padding: 28px; }
  .caption { padding: 0 28px 20px; color: var(--fg-subtle); font-size: 11px; }

  .sb-topbar { padding: 26px 40px 0;
    background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 3%, var(--bg)), var(--bg) 120px);
    border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .sb-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; max-width: 820px; margin: 0 auto; padding-bottom: 26px; }
  .sb-hero-l { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .sb-hero-ic { width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--ghost-border); }
  .sb-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); }
  .sb-hero-tt { font-size: 24px; font-weight: 760; letter-spacing: -0.025em; line-height: 1.1; margin-top: 1px; }
  .sb-hero-sub { font-size: var(--fs-sm); color: var(--fg-muted); margin-top: 3px; line-height: 1.45; max-width: 64ch; }
  .sb-hero-r { display: flex; align-items: center; gap: 8px; flex: none; }
  .ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px;
    border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; border: 1px solid color-mix(in oklch, var(--ok) 30%, transparent);
    color: var(--ok); background: var(--ok-soft); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
  <div class="caption" style="padding-top:24px">Shared hero consumed by Settings &amp; Local LLM. One source of truth for page chrome.</div>
  <div class="frame">
    <div class="sb-topbar">
      <div class="sb-hero">
        <div class="sb-hero-l">
          <div class="sb-hero-ic">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
          </div>
          <div class="sb-hero-tx">
            <div class="sb-eyebrow">Workspace</div>
            <div class="sb-hero-tt">Settings</div>
            <div class="sb-hero-sub">Model, permissions, appearance, and accessibility — everything that shapes how Rift behaves for this workspace.</div>
          </div>
        </div>
        <div class="sb-hero-r">
          <span class="pill"><span class="dot"></span>Synced</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
