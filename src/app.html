<!doctype html>
<html lang="en" data-direction="linear" data-mode="dark" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rift</title>
    <style>
      html, body { margin: 0; background: oklch(0.142 0.003 250); }
      /* Pre-JS first paint: a dim static mark where the splash lockup lands,
         so the window is branded from frame one. The opaque splash (then the
         app surface) paints over it — no cleanup needed. */
      #first-paint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, calc(-50% - 30px)); opacity: 0.45; }
      #first-paint img { display: block; width: 64px; height: 64px; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="first-paint" aria-hidden="true"><img src="%sveltekit.assets%/favicon.png" alt="" /></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
