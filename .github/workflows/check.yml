name: check

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Rapid push bursts (docs condenses etc.) were queueing full runs back-to-back
# on the single self-hosted VM; keep only the latest per ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (cargo check + test + audit + machete)
    # Self-hosted WS2022 runner (Proxmox blazzer-labs); persistent warm target/.
    runs-on: [self-hosted, windows, tauri-build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked || true

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Ignored advisories live in the lockfile but not in Rift's compiled graph:
      #   RUSTSEC-2023-0071 — rsa Marvin timing attack (transitive, no RSA path used).
      #   RUSTSEC-2026-0185 — quinn-proto QUIC mem-exhaustion; pulled only by reqwest's
      #     http3 feature, which we DON'T enable (features = rustls/http2/… , no http3),
      #     so quinn is never compiled in (`cargo tree -i quinn-proto` is empty).
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0185

      - name: cargo machete
        run: cargo machete src-tauri

  frontend:
    name: frontend (svelte-check + vitest + npm audit)
    # Also self-hosted: GitHub-hosted minutes are exhausted (free tier), so an
    # ubuntu-latest job would insta-fail. The WS2022 runner has Node (choco).
    runs-on: [self-hosted, windows, tauri-build]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: npm audit (prod only)
        run: npm audit --omit=dev
