name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: rust (cargo check + test + audit + machete)
    # Self-hosted WS2022 runner (Proxmox blazzer-labs); persistent warm target/.
    runs-on: [self-hosted, windows, tauri-build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked || true

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071

      - name: cargo machete
        run: cargo machete src-tauri

  frontend:
    name: frontend (svelte-check + vitest + npm audit)
    # Also self-hosted: GitHub-hosted minutes are exhausted (free tier), so an
    # ubuntu-latest job would insta-fail. The WS2022 runner has Node (choco).
    runs-on: [self-hosted, windows, tauri-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: npm audit (prod only)
        run: npm audit --omit=dev
