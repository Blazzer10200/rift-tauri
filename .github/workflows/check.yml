name: check

on:
  # NO pull_request trigger: this job runs on a self-hosted runner — a fork PR
  # must never execute code on it. Re-add PR checks only on GitHub-hosted runners.
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Rapid push bursts (docs condenses etc.) were queueing full runs back-to-back
# on the single self-hosted VM; keep only the latest per ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (clippy + test + machete)
    # Self-hosted WS2022 runner; persistent warm target/.
    # Advisory scanning (cargo audit) lives in audit.yml on a DAILY schedule —
    # a fresh RUSTSEC advisory is not a property of the pushed commit, and
    # per-push audit failed every push (+1 email each) until someone intervened.
    runs-on: [self-hosted, windows, tauri-build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked || true

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo machete
        run: cargo machete src-tauri

  frontend:
    name: frontend (svelte-check + vitest)
    # Also self-hosted: GitHub-hosted minutes are exhausted (free tier), so an
    # ubuntu-latest job would insta-fail. The WS2022 runner has Node (choco).
    # npm audit moved to audit.yml (daily) — same reasoning as cargo audit.
    runs-on: [self-hosted, windows, tauri-build]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test
