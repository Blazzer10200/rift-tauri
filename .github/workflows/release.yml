# Tag-driven release. Push a `v*` tag -> this builds, packs with Velopack, and
# publishes a GitHub release on THIS repo (single-repo: the old separate
# `Blazzer10200/rift` releases repo is retired). Replaces running
# `scripts/release.ps1` by hand on a dev machine.
#
# Ship flow (push the TAG FIRST -- one runner, FIFO queue: tag-first puts this
# release job ahead of the redundant `check` run the main push triggers, saving
# ~3 min of queue wait; check still runs after, harmlessly):
#   pwsh scripts/bump.ps1 X.Y.Z   # writes the 3 lockstep files
#   <edit docs/CHANGELOG.md top entry to vX.Y.Z>
#   git commit -am "release vX.Y.Z"
#   git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z && git push origin main
#
# Auth: the built-in GITHUB_TOKEN (permissions: contents: write below) -- releases
# publish to this same repo, so no PAT is needed. The old RELEASES_TOKEN secret
# was retired at the single-repo consolidation.
#
# vpk pin: the vpk CLI version MUST equal the `velopack` crate version (=1.2.0).
# Bump both together (this file + src-tauri/Cargo.toml).

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# NOTE: there is ONE self-hosted runner. A queue-stall watchdog
# can't live here — a GitHub-HOSTED watcher needs billed minutes (suspended), and
# a self-hosted watcher would compete with the build for the single runner (and
# couldn't alarm at all if the runner is wedged, since neither job would run).
# Replaced with a post-publish verify step inside the build job (below): it proves
# the release actually landed on this repo. A wedged runner now surfaces as a
# release that simply never publishes — recover per the internal runner runbook.
jobs:
  release:
    name: build + pack + publish
    # Self-hosted WS2022 runner. Free + warm target/ +
    # sccache make this faster than the metered windows-latest it replaced.
    runs-on: [self-hosted, windows, tauri-build]
    timeout-minutes: 40
    defaults:
      run:
        # WS2022 self-hosted runner ships Windows PowerShell 5.1, not pwsh (Core).
        # release.ps1/bump.ps1 are 5.1-safe (run locally on 5.1 too).
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # No GitHub cache step: the self-hosted runner has a persistent warm
      # CARGO_TARGET_DIR (D:\cargo-target) + sccache, so restoring/uploading a
      # multi-GB GitHub cache would only waste the 0.5 GB Actions storage cap.
      - name: Setup .NET (for vpk)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Self-healing: a runner crash mid-job can corrupt the global dotnet tool
      # store ("Settings file 'DotnetToolSettings.xml' was not found" -- hit on
      # v0.111.0 after the runner dropped offline mid-run). On update failure,
      # nuke the store entry + shims and reinstall fresh instead of failing the
      # release. (Inline PS stays ASCII-only -- WinPS 5.1.)
      - name: Install vpk (pinned to velopack crate version)
        run: |
          # Already at the pinned version -> skip the nuget roundtrip entirely
          # (outage-proofing: no network call when the runner is already set up).
          if (Get-Command vpk -ErrorAction SilentlyContinue) {
            $banner = (& vpk -h 2>&1 | Select-String 'Velopack CLI ([0-9.]+)')
            if ($banner -and $banner.Matches[0].Groups[1].Value -eq '1.2.0') {
              Write-Host "vpk 1.2.0 already installed: $((Get-Command vpk).Source)"
              exit 0
            }
          }
          $ok = $false
          if (Get-Command vpk -ErrorAction SilentlyContinue) {
            dotnet tool update -g vpk --version 1.2.0
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            else {
              Write-Host 'vpk update failed - repairing corrupt dotnet tool store'
              dotnet tool uninstall -g vpk
              Remove-Item -Recurse -Force "$env:USERPROFILE\.dotnet\tools\.store\vpk" -ErrorAction SilentlyContinue
              Remove-Item -Force "$env:USERPROFILE\.dotnet\tools\vpk*" -ErrorAction SilentlyContinue
            }
          }
          if (-not $ok) {
            dotnet tool install -g vpk --version 1.2.0
            if ($LASTEXITCODE -ne 0) { throw 'vpk install failed after store repair' }
          }
          & vpk -h | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'vpk installed but not runnable' }
          Write-Host "vpk ready: $((Get-Command vpk).Source)"

      # The self-hosted runner doesn't ship the gh CLI (release.ps1 uses it for
      # the release existence check + asset cleanup). Installed to a PERSISTENT
      # dir on the runner (D:\tools\gh -- same disk as CARGO_HOME) so every run
      # after the first skips the network entirely. The latest-version lookup is
      # best-effort with a pinned fallback: the 2026-07-16 GitHub outage 503'd
      # that exact api.github.com call and killed two release runs pre-build.
      # gh here only reads/deletes release assets -- any modern version works.
      - name: Ensure gh CLI on PATH
        run: |
          if (Get-Command gh -ErrorAction SilentlyContinue) { Write-Host 'gh already present'; exit 0 }
          $toolDir = 'D:\tools\gh'
          $ghExe = Get-ChildItem -Path $toolDir -Recurse -Filter 'gh.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ghExe) {
            $ver = $null
            try {
              $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/cli/cli/releases/latest' -Headers @{ 'User-Agent' = 'rift-runner'; 'Authorization' = "Bearer $env:GITHUB_TOKEN" }
              $ver = $rel.tag_name.TrimStart('v')
            } catch {
              $ver = '2.62.0'
              Write-Host "latest-gh lookup failed ($($_.Exception.Message)) -- falling back to pinned gh v$ver"
            }
            $zip = Join-Path $env:RUNNER_TEMP 'gh.zip'
            Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v$ver/gh_${ver}_windows_amd64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $toolDir -Force
            $ghExe = Get-ChildItem -Path $toolDir -Recurse -Filter 'gh.exe' | Select-Object -First 1
            if (-not $ghExe) { throw "gh.exe not found after extracting $zip" }
          }
          $bin = $ghExe.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $ghExe.FullName --version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: npm ci
        run: npm ci

      # Gate dedup: check.yml runs these exact gates (and more) on every push to
      # main. If a COMPLETED check run for THIS sha already SUCCEEDED, the inline
      # gates below are redundant -- skip them (~2 min saved when tagging an
      # already-checked commit). Queued/missing/cancelled -> run inline (with one
      # runner, a same-moment check can never be mid-run while we execute). A
      # FAILED check fails the release loudly -- a tag must never ship red code.
      - name: Resolve prior check verdict
        id: gates
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$env:GITHUB_SHA&per_page=5"
          $mode = 'inline'
          try {
            $resp = Invoke-RestMethod -Uri $uri -Headers @{ 'Authorization' = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'rift-release'; 'Accept' = 'application/vnd.github+json' }
            $done = @($resp.workflow_runs | Where-Object { $_.status -eq 'completed' })
            if ($done.Count -ge 1) {
              $conc = $done[0].conclusion
              if ($conc -eq 'success') { $mode = 'skip' }
              elseif ($conc -eq 'failure') { throw "check workflow FAILED for $env:GITHUB_SHA -- fix main before tagging a release" }
            }
          } catch {
            if ("$_" -match 'check workflow FAILED') { throw }
            Write-Host "verdict lookup failed ($_) -- running gates inline"
          }
          Write-Host "gates: $mode"
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Quality gate: the tag-driven release used to build+publish with NO test gate
      # (tests lived only in the separate, push-triggered `check` workflow, which
      # cancel-in-progress can kill before a tag ships). v0.31.0 shipped a build
      # whose `cargo test` had gone red in check. These four steps run on the
      # warm self-hosted target/ and fail the job BEFORE the build/publish below,
      # so a tag can never ship un-tested code again (skipped ONLY when check.yml
      # already proved this exact sha green -- see gate dedup above).
      - name: clippy
        if: steps.gates.outputs.mode == 'inline'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: svelte-check
        if: steps.gates.outputs.mode == 'inline'
        run: npm run check
      - name: cargo test
        if: steps.gates.outputs.mode == 'inline'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: vitest
        if: steps.gates.outputs.mode == 'inline'
        run: npm test

      # release.ps1 -Ci: skips the dirty-tree refusal, asserts GITHUB_REF_NAME
      # matches the bumped version, then build + pack + publish to this repo
      # using the workflow's built-in token (contents: write above).
      - name: Release
        run: scripts/release.ps1 -Ci -Token $env:RELEASES_TOKEN
        env:
          RELEASES_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # R2 feed upload — publishes FIRST (feed-first ordering in release.ps1
          # so a GitHub outage can't strand the live update feed).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # Post-publish verify (replaces the old hosted-ubuntu stall watchdog).
      # Proves the release actually landed on this repo for THIS tag: the
      # release exists AND carries the Velopack installer asset. Fails loudly if
      # release.ps1 reported success but the artifact didn't make it (e.g. a
      # partial publish).
      #
      # UNAUTHENTICATED on purpose. This repo is PUBLIC, so a plain anonymous GET
      # on the public API reads the release fine. The previous version passed
      # GH_TOKEN=RELEASES_TOKEN to `gh release view`; that fine-grained PAT can
      # PUBLISH (Contents:write, used by the Release step) but `gh`'s REST read
      # path returned HTTP 401 Bad credentials for it on v0.35.0 — false-failing a
      # release that published perfectly. Dropping the token removes that whole
      # class of auth mismatch; no credential is needed to read a public release.
      - name: Verify published
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')

          # 1) THE FEED (client-critical): releases.win.json on R2 must list this
          # version as a Full package -- this is what installed clients read.
          # LOCKSTEP: URL must equal update_service.rs UPDATE_FEED_URL.
          $feed = 'https://pub-4fb26c0fc8df484488e4415f112f2d28.r2.dev/releases.win.json'
          Write-Host "Verifying feed carries v$ver ..."
          $feedJson = Invoke-RestMethod -Uri $feed -Headers @{ 'Cache-Control' = 'no-cache' } -ErrorAction Stop
          $hit = @($feedJson.Assets | Where-Object { $_.Type -eq 'Full' -and $_.Version -eq $ver })
          if (-not $hit) {
            $seen = (@($feedJson.Assets | Where-Object { $_.Type -eq 'Full' } | ForEach-Object { $_.Version }) | Sort-Object -Unique) -join ', '
            throw "FEED STALE: releases.win.json does not list v$ver (has: $seen) -- clients will NOT see this update."
          }
          Write-Host "OK: feed lists v$ver -- clients can update."

          # 2) GitHub release (human download page). Secondary: a miss here still
          # fails the run (rerun restores the page) but the message must make the
          # feed state unmistakable. Anonymous read on purpose -- see git history
          # (a PAT-authed read false-failed v0.35.0).
          $repo = 'Blazzer10200/rift-tauri'
          Write-Host "Verifying $tag published to $repo (anonymous public read) ..."
          $headers = @{ 'User-Agent' = 'rift-release-verify'; 'Accept' = 'application/vnd.github+json' }
          $uri = "https://api.github.com/repos/$repo/releases/tags/$tag"
          try {
            $rel = Invoke-RestMethod -Uri $uri -Headers $headers -ErrorAction Stop
          } catch {
            throw "Release $tag not found in $repo (FEED IS LIVE -- clients are updating; rerun once GitHub recovers to restore the release page). ($($_.Exception.Message))"
          }
          $assets = @($rel.assets | ForEach-Object { $_.name })
          Write-Host "Assets: $($assets -join ', ')"
          if ($assets -notcontains 'Rift-win-Setup.exe') {
            throw "Release $tag exists but Rift-win-Setup.exe asset is missing -- partial publish (feed is live; rerun to fix the page)."
          }
          Write-Host "OK: $tag published with installer asset."
