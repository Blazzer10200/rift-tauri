# Tag-driven release. Push a `v*` tag -> this builds, packs with Velopack, and
# publishes to the public `Blazzer10200/rift` repo. Replaces running
# `scripts/release.ps1` by hand on a dev machine.
#
# Ship flow:
#   pwsh scripts/bump.ps1 X.Y.Z   # writes the 3 lockstep files
#   <edit docs/CHANGELOG.md top entry to vX.Y.Z>
#   git commit -am "release vX.Y.Z"
#   git tag vX.Y.Z && git push origin main --tags
#
# Auth: needs a fine-grained PAT scoped to `rift-releases` with contents:write,
# stored as the repo secret RELEASES_TOKEN. The default GITHUB_TOKEN only scopes
# THIS (source) repo, so it cannot publish to the separate releases repo.
#
# vpk pin: the vpk CLI version MUST equal the `velopack` crate version (=1.2.0).
# Bump both together (this file + src-tauri/Cargo.toml).

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  issues: write   # watchdog opens an alert issue when the runner stalls

jobs:
  # Queue-stall watchdog. Self-hosted runners can wedge: the listener reports
  # `online` to GitHub but stops pulling jobs, so the release sits `queued`
  # forever (timeout-minutes only counts AFTER a runner picks the job up, so it
  # never fires here). This GitHub-hosted job is the alarm: it polls THIS run's
  # release job and, if it hasn't left the queue inside the grace window, fails
  # loudly + opens an issue. Cheap (~free ubuntu), turns a silent stall into a
  # visible red X + notification. It does NOT build — revive proxmox-win then
  # re-run (see docs/RUNNER-RUNBOOK.md).
  watchdog:
    name: runner-stall watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      issues: write
    steps:
      - name: Wait for the release job to leave the queue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          GRACE_SECONDS: '300'   # 5 min: prior good releases dispatch in seconds
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + GRACE_SECONDS ))
          while :; do
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name | startswith("build + pack + publish")) | .status' || echo "")
            echo "release job status: ${status:-<none>}"
            if [ "$status" = "in_progress" ] || [ "$status" = "completed" ]; then
              echo "Release job dispatched to a runner — watchdog clear."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Release job for $REF still queued after ${GRACE_SECONDS}s — runner likely wedged."
              runners=$(gh api "repos/$REPO/actions/runners" --jq '[.runners[] | {name,status,busy}]' || echo "[]")
              body=$(printf '**Release \`%s\` stalled in the queue (%ss).**\n\nThe self-hosted runner did not pick up the build job. It usually reports `online` but has stopped pulling work (wedged listener).\n\nRunners: \`%s\`\n\n**Fix:** on the `proxmox-win` host, restart the runner service, then re-run this workflow. See `docs/RUNNER-RUNBOOK.md`.\n\nRun: %s/%s/actions/runs/%s' \
                "$REF" "$GRACE_SECONDS" "$runners" "${GITHUB_SERVER_URL:-https://github.com}" "$REPO" "$RUN_ID")
              gh issue create --repo "$REPO" \
                --title "Release $REF stalled: self-hosted runner not dispatching" \
                --body "$body" \
                --label "ci,release-blocked" 2>/dev/null \
                || gh issue create --repo "$REPO" \
                     --title "Release $REF stalled: self-hosted runner not dispatching" \
                     --body "$body"
              exit 1
            fi
            sleep 15
          done

  release:
    name: build + pack + publish
    # Self-hosted WS2022 runner on Proxmox (blazzer-labs). Free + warm target/ +
    # sccache make this faster than the metered windows-latest it replaced.
    runs-on: [self-hosted, windows, tauri-build]
    timeout-minutes: 40
    defaults:
      run:
        # WS2022 self-hosted runner ships Windows PowerShell 5.1, not pwsh (Core).
        # release.ps1/bump.ps1 are 5.1-safe (run locally on 5.1 too).
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # No GitHub cache step: the self-hosted runner has a persistent warm
      # CARGO_TARGET_DIR (D:\cargo-target) + sccache, so restoring/uploading a
      # multi-GB GitHub cache would only waste the 0.5 GB Actions storage cap.
      - name: Setup .NET (for vpk)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk (pinned to velopack crate version)
        run: |
          if (Get-Command vpk -ErrorAction SilentlyContinue) { dotnet tool update -g vpk --version 1.2.0 } else { dotnet tool install -g vpk --version 1.2.0 }

      # The self-hosted runner doesn't ship the gh CLI (release.ps1 uses it for
      # the rift-releases existence check + asset cleanup). Download the latest
      # standalone zip and prepend its bin to PATH -- no choco/winget dependency.
      - name: Ensure gh CLI on PATH
        run: |
          if (Get-Command gh -ErrorAction SilentlyContinue) { Write-Host 'gh already present'; exit 0 }
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/cli/cli/releases/latest' -Headers @{ 'User-Agent' = 'rift-runner'; 'Authorization' = "Bearer $env:GITHUB_TOKEN" }
          $ver = $rel.tag_name.TrimStart('v')
          $zip = Join-Path $env:RUNNER_TEMP 'gh.zip'
          Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v$ver/gh_${ver}_windows_amd64.zip" -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'gh'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $ghExe = Get-ChildItem -Path $dest -Recurse -Filter 'gh.exe' | Select-Object -First 1
          if (-not $ghExe) { throw "gh.exe not found after extracting $zip" }
          $bin = $ghExe.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $ghExe.FullName --version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: npm ci
        run: npm ci

      # Test gate: the tag-driven release used to build+publish with NO test gate
      # (tests lived only in the separate, push-triggered `check` workflow, which
      # cancel-in-progress can kill before a tag ships). v0.31.0 shipped a build
      # whose `cargo test` had gone red in check. These three steps run on the
      # warm self-hosted target/ and fail the job BEFORE the build/publish below,
      # so a tag can never ship un-tested code again.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: svelte-check
        run: npm run check
      - name: vitest
        run: npm test

      # release.ps1 -Ci: skips the dirty-tree refusal, asserts GITHUB_REF_NAME
      # matches the bumped version, then build + pack + publish to rift-releases
      # using the PAT.
      - name: Release
        run: scripts/release.ps1 -Ci -Token $env:RELEASES_TOKEN
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # R2 dual-publish (release.ps1 §2) — fires only when all present.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
